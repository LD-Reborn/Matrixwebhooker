services:
  webhooker:
    build: .
    image: matrix-webhooker
    container_name: matrix-webhooker
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # config & credentials (never baked into the image, see .dockerignore)
      - ./.env:/app/.env:ro
      - ./bots.json:/app/bots.json:ro
      # per-bot access tokens + remembered room ids survive container rebuilds
      - matrix-webhooker-state:/app/state
    environment:
      HOST: 0.0.0.0
      MATRIX_STATE_DIR: /app/state
    # Lets the container reach a Synapse listening on the host (e.g.
    # MATRIX_HOME_SERVER=http://host.docker.internal:8008) if desired.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  matrix-webhooker-state:
